{{ define "main" }}
  <div class="posts-nav-wrapper">
    <nav class="posts-nav">
      <h1 class="posts-title">{{ .Title }}</h1>
      <div class="posts-nav-actions">
        <button type="button" class="posts-nav-button" id="month-button">Month</button>
        <button type="button" class="posts-nav-button" id="tags-button">Tags</button>
      </div>
    </nav>

    <div class="tags-panel" id="tags-panel" aria-hidden="true">
      <ul>
        {{ range $tag, $pages := .Site.Taxonomies.tags }}
          <li><a href="/tags/{{ $tag | urlize }}/">#{{ $tag | lower }}</a></li>
        {{ end }}
      </ul>
    </div>
  </div>

  {{ .Content }}

  {{ range .Pages }}
    <section>
      <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
      {{ .Summary }}
    </section>
  {{ end }}
{{ end }}
